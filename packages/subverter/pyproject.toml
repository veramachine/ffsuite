[build-system]
# 1.26.0 brought license-files to PEP 639's final form; 1.26.2 fixed the metadata 1.26.0 wrote
# for older core-metadata versions (hatchling's changelog)
requires = ["hatchling>=1.26.2"]
build-backend = "hatchling.build"

[project]
name = "subverter"
version = "0.1.0"
description = "Subtitle and transcript readers -- SubRip, WebVTT, LRC, CSV, TSV, whisper's JSON -- into one model"
readme = "README.md"
# the owner's: MIT or Apache-2.0, the user's choice
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.13"
authors = [{ name = "VERA LVX", email = "veralvx@veralvx.com" }]
maintainers = [{ name = "VERA LVX", email = "veralvx@veralvx.com" }]
keywords = [
    "subtitles",
    "srt",
    "webvtt",
    "vtt",
    "lrc",
    "transcript",
    "whisper",
    "whisperx",
    "captions",
]
# https://pypi.org/classifiers/ -- no License :: one (PEP 639); OS Independent: nothing
# platform-bound imported (measured)
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [] # the standard library alone

[project.urls]
Homepage = "https://github.com/veramachine/ffsuite/tree/main/packages/subverter"
Issues = "https://github.com/veramachine/ffsuite/issues"
Repository = "https://github.com/veramachine/ffsuite"

[tool.hatch.build.targets.wheel]
packages = ["src/subverter"]

[tool.pytest.ini_options]
# its own, for its sdist's tests alone; from the repository's root, the root's governs
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
