# imi's dependabot.yml, GitHub Actions alone: they are pinned to commits, each release in a
# comment, and Dependabot moves both (docs.github.com, "Dependabot supported ecosystems").
# No uv entry: every pin in pyproject.toml's dependency groups is the pinned nixpkgs' version, so
# uv's verdict is Nix's -- the pins move at a nixpkgs bump (docs/upgrading.md), held there by
# nix/checks.nix's `pins`, and security.yml audits them daily. The packages need nothing beyond
# the workspace.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: # each created once (Issues > Labels): one the repository lacks is ignored
      - "dependencies"
      - "actions"
    groups:
      # minor and patch updates in one pull request (dependabot-automerge.yml merges it once the
      # checks pass); a major one alone, for review
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3 # the one cooldown key GitHub Actions takes
