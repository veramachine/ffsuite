# imi's dependabot.yml, GitHub Actions alone: they are pinned to commits, each release in a
# comment, and Dependabot moves both (docs.github.com, "Dependabot supported ecosystems").
# No uv entry, though Dependabot updates uv locks: the packages need nothing beyond the workspace,
# and every pin in pyproject.toml's dependency groups is the pinned nixpkgs' version, so uv's
# verdict is Nix's -- the pins move at a nixpkgs bump (docs/upgrading.md), held there by
# nix/checks.nix's `pins`, which a Dependabot bump would fail (and Dependabot's own uv, 0.12.19 in
# dependabot-core's image, is refused by `required-version`). The lock's advisories: security.yml's
# pip-audit, and Dependabot alerts (the repository's setting), its graph jobs reading uv.lock.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: # each created once (Issues > Labels): one the repository lacks is ignored
      - "dependencies"
      - "actions"
    groups:
      # minor and patch updates in one pull request (dependabot-automerge.yml merges it once the
      # checks pass); a major one alone, for review
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 3 # Dependabot's default too (its options reference), set explicitly
