# imi's style-check-cocogitto.yml; on a push, the whole history, not --from-latest-tag: with no tag
# yet, cog 7.0.0 (the action's) stops "unable to get any tag" (measured), and every commit here is
# conventional from the first. A pull request's title too: a squash merge of two commits or more
# makes it the commit (docs.github.com, "Configuring commit squashing for pull requests"), and so
# a changelog entry (cliff.toml) -- checked again when it is edited.
name: Conventional Commits Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

# a pull request's newest run cancels its older ones; any other run, a group of its own: every
# commit on main checked (in a shared group, a pending run gives way to the newest: the default)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_commits:
    name: Check Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check PR Commits
        if: github.event_name == 'pull_request'
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check
          args: --ignore-merge-commits ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Check PR Title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }} # through the environment, never the script
        run: cog verify "$TITLE"

      - name: Check Push Commits
        if: github.event_name == 'push'
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check
          args: --ignore-merge-commits
