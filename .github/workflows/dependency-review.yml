# imi's dependency-review.yml, adapted: the workflows' actions alone. uv.lock reaches GitHub's
# dependency graph only through Dependabot's graph jobs (GitHub's changelog, 2026-04-23), seen
# here on main alone: whether a pull request's lock change is reviewed is unmeasured, so the
# lock is security.yml's (pip-audit). Every action is pinned to a commit, and GitHub's advisories
# match actions by semantic version alone ("Dependency graph supported package ecosystems"):
# what this gates in effect is the licences.
name: Dependency Review

on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: License & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >
            0BSD, Apache-2.0, BlueOak-1.0.0, BSD-2-Clause, BSD-3-Clause,
            BSL-1.0, CC0-1.0, CC-BY-4.0, ISC, MIT, MIT-0, MPL-2.0,
            OpenSSL, Unicode-3.0, Unicode-DFS-2016, Unlicense, Zlib
          comment-summary-in-pr: on-failure
