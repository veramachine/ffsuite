# csan's release.yml for the workspace: a package's tag makes its GitHub release -- its sdist
# and wheel, as publish.yml builds them (byte for byte alike, measured, on one hatchling), and
# as notes the commits that touched the package since its previous tag.
name: Release

on:
  push:
    tags: ["ffman-v*", "ffmeta-v*", "subverter-v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history and tags the notes read

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package=$(.github/package-tag.sh "$GITHUB_REF_NAME")
          uv build --package "$package" --no-sources
          # the package's previous tag, if any: the notes start after it
          previous=$(git describe --tags --abbrev=0 --match "$package-v*" "$GITHUB_REF_NAME^" \
            2>/dev/null || true)
          git log --format='- %s (%h)' "${previous:+$previous..}$GITHUB_REF_NAME" \
            -- "packages/$package" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$package ${GITHUB_REF_NAME##*-v}" --notes-file notes.md
