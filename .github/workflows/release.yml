# csan's release.yml for the workspace: a package's tag makes its GitHub release -- its sdist
# and wheel, as publish.yml builds them (byte for byte alike, measured, on one hatchling), and
# as notes the release's section of its CHANGELOG.md, which the bump wrote (cog.toml, git-cliff):
# read from the tag, so a re-run gives the same notes (git-cliff's --current fails on a tag once a
# later one exists, measured).
name: Release

on:
  push:
    tags: ["ffman-v*", "ffmeta-v*", "subverter-v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package=$(.github/package-tag.sh "$GITHUB_REF_NAME")
          uv build --package "$package" --no-sources
          # the first section, up to the second `## ` heading: the tag's own, or no release
          awk '/^## /{n++} n==1' "packages/$package/CHANGELOG.md" > notes.md
          [[ $(head -n 1 notes.md) == "## ${GITHUB_REF_NAME##*-v} - "* ]]
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$package ${GITHUB_REF_NAME##*-v}" --notes-file notes.md
