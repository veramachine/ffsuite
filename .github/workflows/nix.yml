# The flake's checks where ffmpeg is the pin: nixpkgs' ffmpeg-full 8.1.2 and FLAC 1.5, which a
# runner's apt cannot give -- the ffmpeg-bound tests, the matrix, the installed binary, types,
# dead code, lint and the pins (nix/checks.nix), built on each system the flake declares: x86_64
# and aarch64 Linux, Apple silicon (macos-latest: macOS 26 Arm64; actions/runner-images). A
# runner checks its own system alone, so every system is also evaluated in one job. On a pull
# request, the outcome report against its base.
name: Nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a pull request's newest run cancels its older ones; any other run, a group of its own: every
# commit on main checked (in a shared group, a pending run gives way to the newest: the default)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        # flakes on, and the job's token for GitHub fetches (its install-nix.sh)
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: nix flake check
        run: nix flake check --print-build-logs

  evaluate:
    # every output of every system, nothing built: a break on one runner's system alone shows
    # here too, in seconds (the three systems evaluated in 13 s, measured)
    name: nix flake check --all-systems (evaluation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Evaluate
        run: nix flake check --no-build --all-systems

  outcome:
    # What the pull request changes in ffman's outcomes (AGENTS.md, "The outcome report"): exit 1
    # on any change, each one's diff printed -- a signal to read, not a required check.
    name: Outcome report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base revision, which the report exports

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Compare with the base
        # in the dev shell (nix/shell.nix): its uv on its Python, the runtime tools on PATH; the
        # report needs the workspace's packages alone, not the dev group (measured)
        working-directory: packages/ffman
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          nix develop ../.. --command uv sync --locked --no-dev
          nix develop ../.. --command uv run --no-sync python -m tests.outcome compare "$BASE"
