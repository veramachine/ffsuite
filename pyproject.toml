# The workspace's root: no project of its own (uv's virtual root) -- ffman, ffmeta and subverter
# are its members, each its own pyproject.toml under packages/. Here: the workspace, the dev
# group, and the tools' configuration for all three.

[dependency-groups]
# exactly the pinned nixpkgs' versions, as every pin here (nix/checks.nix's `pins` holds them):
# CI's verdict and Nix's one -- with floors, the lock took newer ones, and ruff 0.16 (its ALL
# grown) and numpy 2.5's stubs disagreed with them on the same code (measured)
dev = [
    "basedpyright==1.39.3",
    "coverage==7.14.1", # pytest-cov's, floating otherwise: the coverage floor is its verdict
    "hypothesis==6.151.10",
    "numpy==2.4.4",
    "packaging==26.1", # test_workspace's and `just release`'s: requirements read as pip reads them
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.14",
    "ty==0.0.38",
    "vulture==2.14",
]
# security.yml's and `just audit`'s: pip-audit over the lock, exported (`uv export`); not the dev
# group, so not in `uv sync`'s default environment
audit = ["pip-audit==2.10.0"]
# `just changelog`'s: git-cliff, each package's changelog (cliff.toml), run as `audit` is
release = ["git-cliff==2.13.1"]

[tool.uv]
# uv too is nixpkgs' (the `pins` check): its resolver writes and checks the lock, and setup-uv
# installs this one in the workflows (its README: `required-version`, else the latest)
required-version = "==0.11.21"

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py313"
line-length = 100
# first-party: ffman and its `tests` package, from their import roots (pytest's pythonpath); the
# libraries, other distributions, sort as third-party
src = ["packages/ffman/src", "packages/ffman"]
# reference, not ffman's code: the skills' scripts, the planning-era docs
extend-exclude = [".agents", "docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The formatter owns trailing commas: ruff's docs advise against this rule beside it.
    "COM812",
    # Long strings are joined with an explicit +: basedpyright's reportImplicitStringConcatenation
    # (a missing comma merges two strings unseen) refuses implicit concatenation outside its own
    # parentheses -- a call's argument, a tuple's item -- where ISC003 asks for it.
    "ISC003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests, all three trees (ruff applies every pattern a file matches): assert is the tool;
# literal expectations are the point; a docstring per test would repeat its name, and one
# written is a note on the case, not an API's (D); pytest and Hypothesis fill a test's
# parameters: no call written passes a bare bool (FBT001, FBT003 still checking the calls), and
# their number is the case's fixtures and fields -- as a helper building a case takes one a
# field, and an oracle's port its original's arguments (PLR0913); expected messages are exact
# and read best whole (E501).
"**/tests/**" = ["S101", "PLR2004", "D", "FBT001", "E501", "PLR0913"]
# The libraries' test trees are no packages -- an __init__.py would make another `tests`
# (pytest's importlib mode needs none; pythonpath makes each helper package importable).
"packages/ffmeta/tests/**" = ["INP001"]
"packages/subverter/tests/**" = ["INP001"]
# The command line reports to the terminal: printing is its job.
"packages/ffman/src/ffman/cli.py" = ["T201"]
# Line breaking's tests and their transcripts: full-width characters (！, ％, ０) are what they
# test, not lookalikes.
"packages/ffman/tests/test_breaks.py" = ["RUF001"]
"packages/ffman/tests/support/transcripts.py" = ["RUF001"]
# The copies' test: the libraries' private copies of ffman's helpers are its subject.
"packages/ffman/tests/test_copies.py" = ["SLF001"]

[tool.ty.src]
# as ruff's: the skills' scripts and the planning-era docs are reference, not the packages' code
exclude = [".agents", "docs"]

[tool.basedpyright]
# the import roots: the three packages' sources, resolved from the tree whatever is installed
# (the flake's types check has no editable install), and what pytest's pythonpath names --
# ffman's `tests` package (packages/ffman) and each library's helper package
extraPaths = [
    "packages/ffman/src",
    "packages/ffmeta/src",
    "packages/subverter/src",
    "packages/ffman",
    "packages/ffmeta/tests",
    "packages/subverter/tests",
]
pythonVersion = "3.13"
include = [
    "packages/ffman/src",
    "packages/ffman/tests",
    "packages/ffmeta/src",
    "packages/ffmeta/tests",
    "packages/subverter/src",
    "packages/subverter/tests",
]
typeCheckingMode = "all"
failOnWarnings = true

[tool.pytest.ini_options]
minversion = "9.0"
# three test trees, one run; importlib: none on sys.path but what pythonpath names -- ffman's
# tests package (packages/ffman) and each library's helper package, each its own name
testpaths = ["packages/ffman/tests", "packages/ffmeta/tests", "packages/subverter/tests"]
pythonpath = ["packages/ffman", "packages/ffmeta/tests", "packages/subverter/tests"]
addopts = ["-ra", "--import-mode=importlib"]
# every strictness pytest has, as errors: unknown options and markers, an xfail that passes, a
# repeated parametrize id -- and any it adds, on an upgrade. Set here: pytest 9.0 ignores
# --strict-markers and --strict-config in addopts (pytest-dev/pytest#14442, fixed in 9.1)
strict = true
filterwarnings = ["error"] # a warning fails the suite: a leaked pipe went unseen for long
timeout = 600
markers = [
    "ffmpeg: needs a pinned tool, ffmpeg 8.1 or metaflac 1.5 (integration)",
    "slow: the combination matrix",
]

[tool.vulture]
# The product only: in the tests, pytest fixtures are used by name, which vulture cannot see.
paths = ["packages/ffman/src", "packages/ffmeta/src", "packages/subverter/src"]
# set, never read here: Python reads it, naming an error in a traceback (ffmeta.Error)
ignore_names = ["__module__"]

[tool.coverage.run]
branch = true
source = ["ffman", "ffmeta", "subverter"]
# The signal tests run ffman in a child Python: measure it there too.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 95
show_missing = true
