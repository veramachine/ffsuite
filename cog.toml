# imi's cocogitto 7.0.0 configuration, for three packages each released on its own. Its tables are
# strict (unknown keys refused): the packages are `[monorepo.packages]`, not `[packages]`.

# check every commit, not from the latest tag: with no tag, cog stops "unable to get any tag"
from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = true
# git-cliff writes the changelogs (cliff.toml), in the hooks below
disable_changelog = true
branch_whitelist = ["main"]
generate_mono_repository_global_tag = false
# a package's tag, `ffmeta-v0.2.0`: what publish.yml reads
generate_mono_repository_package_tags = true
tag_prefix = "v"
# hooks run in the package's folder (just runs from the root); their changes join the bump's
# commit. `uv version` also re-locks; the README's image, `ffman:0.1.0`, takes the version, as
# nix/image.nix tags it (test_readme); test_workspace refuses a version ffman's dependency range
# excludes (uv's lock records workspace members without one)
pre_package_bump_hooks = [
    "uv version --package {{package}} {{version}} --no-sync",
    '''uv run --no-sync python -c "import pathlib, re; p = pathlib.Path('README.md'); p.write_text(re.sub(r'\b{{package}}:\d+\.\d+\.\d+\S*', '{{package}}:{{version}}', p.read_text(encoding='utf-8')), encoding='utf-8')"''',
    "just changelog {{package}} --tag {{package}}-v{{version}} --output packages/{{package}}/CHANGELOG.md",
    "uv run --no-sync pytest -q -p no:cacheprovider ../ffman/tests/test_workspace.py",
]

[monorepo.packages]
ffman = { path = "packages/ffman" }
ffmeta = { path = "packages/ffmeta" }
subverter = { path = "packages/subverter" }
