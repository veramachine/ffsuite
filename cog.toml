# imi's cocogitto 7.0.0 configuration, for three packages each released on its own. Its tables are
# strict (unknown keys refused): the packages are `[monorepo.packages]`, not `[packages]`.

# check every commit, not from the latest tag: with no tag, cog stops "unable to get any tag"
from_latest_tag = false
ignore_merge_commits = true
ignore_fixup_commits = true
# ffman's CHANGELOG.md is a curated contract (AGENTS.md); release notes come from git log
disable_changelog = true
branch_whitelist = ["main"]
generate_mono_repository_global_tag = false
# a package's tag, `ffmeta-v0.2.0`: what release.yml and publish.yml read
generate_mono_repository_package_tags = true
tag_prefix = "v"
# hooks run in the package's folder. `uv version` also re-locks; test_workspace refuses a version
# ffman's dependency range excludes (uv's lock records workspace members without one)
pre_package_bump_hooks = [
    "uv version --package {{package}} {{version}} --no-sync",
    "uv run --no-sync pytest -q -p no:cacheprovider ../ffman/tests/test_workspace.py",
]

[monorepo.packages]
ffman = { path = "packages/ffman" }
ffmeta = { path = "packages/ffmeta" }
subverter = { path = "packages/subverter" }
